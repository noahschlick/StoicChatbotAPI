
services:
  stoic-chatbot:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      # Mount your code for development (hot reload)
      - .:/app
      # Mount a volume for persistent data if needed
      - ./context_data:/app/context_data
    stdin_open: true
    tty: true
    # Override the default command for development
    command: python main.py
    
  # Optional: Web service if you want to run Flask in web mode
  stoic-chatbot-web:
    build: .
    ports:
      - "8000:5000"
    env_file: .env
    command: python main.py